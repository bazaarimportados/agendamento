<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos que chegaram · Bazaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3f1; --surface:#ffffff; --ink:#1d1214; --muted:#6f5f62; --line:#e6dcda;
  --brand:#580b1d; --brand-ink:#ffffff; --brand-soft:#f3e6e8; --ok:#1f6b45; --ok-soft:#e3f1e9;
  --warn:#8a5a00; --warn-soft:#fbf0d9; --off:#9a8d8f;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160e10; --surface:#211719; --ink:#f4ecec; --muted:#b9a9ab; --line:#3a2c2f;
    --brand:#b8344f; --brand-ink:#ffffff; --brand-soft:#3a1a21; --ok:#7fd0a5; --ok-soft:#173226;
    --warn:#f0c46a; --warn-soft:#3a2e14; --off:#7c6e70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160e10; --surface:#211719; --ink:#f4ecec; --muted:#b9a9ab; --line:#3a2c2f;
  --brand:#b8344f; --brand-ink:#ffffff; --brand-soft:#3a1a21; --ok:#7fd0a5; --ok-soft:#173226;
  --warn:#f0c46a; --warn-soft:#3a2e14; --off:#7c6e70; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 18px;border-bottom:2px solid var(--brand)}
.brand{font-weight:700;letter-spacing:.32em;font-size:13px;color:var(--brand)}
h1{margin:4px 0 0;font-size:clamp(24px,4vw,34px);font-weight:600;letter-spacing:-.01em}
.sheetinfo{font-size:13px;color:var(--muted);text-align:right}
.sheetinfo select{margin-left:6px;padding:6px 8px;border:1px solid var(--line);background:var(--surface);border-radius:6px}

.drop{margin-top:28px;border:2px dashed var(--line);border-radius:14px;background:var(--surface);padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop strong{display:block;font-size:18px;margin-bottom:6px}
.drop p{margin:0;color:var(--muted);font-size:14px}
.drop input{display:none}
.mini-drop{font-size:13px;color:var(--brand);background:none;border:1px solid var(--brand);border-radius:999px;padding:6px 14px;cursor:pointer}

.app{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;margin-top:20px;align-items:start}
@media (max-width:820px){.app{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.list{max-height:68vh;overflow:auto}
@media (max-width:820px){.list{max-height:46vh}}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;cursor:pointer}
.row:hover{background:var(--brand-soft)}
.row[aria-current="true"]{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.row .n{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.row .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.sent{background:var(--ok-soft);color:var(--ok)}
.pill.pdf{background:var(--warn-soft);color:var(--warn)}
.marks{margin-top:14px;display:grid;gap:6px}
.mark{display:block;font-size:13px;padding:9px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.mark b{font-weight:700}
.mark.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.mark.pdf{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.who input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:160px;font-weight:600}
.who .hint{font-size:12px}
.pill.lib{background:var(--brand-soft);color:var(--brand)}
.empty{padding:28px 16px;color:var(--muted);font-size:14px;text-align:center}

.detail{padding:20px 20px 24px}
.detail h2{margin:0;font-size:24px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f textarea,label.f select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:500;font-size:14px;color:var(--ink)}
label.f textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}

.items{margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.items-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);font-size:13px;font-weight:600}
.it{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.it.off .nm{color:var(--off)}
.it input.nm{width:100%;min-width:0;padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:13px;color:var(--ink)}
.it input.nm:hover{border-color:var(--line)}
.it input.nm:focus{border-color:var(--brand);background:var(--bg);outline:none}
.it .ctl{display:flex;gap:6px;align-items:center}
.it input.inc{width:18px;height:18px;accent-color:var(--brand)}
.it select.st{font-size:11.5px;font-weight:700;padding:5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);text-transform:uppercase}
.it select.st.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.it select.st.no{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.it input.val{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.it input.val.muted{color:var(--off);text-decoration:line-through}
@media (max-width:560px){.it{grid-template-columns:22px 1fr}.it .ctl{grid-column:2;justify-content:flex-end}}
.conf{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.conf.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.conf.no{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.sum{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:14px;max-width:380px;margin-left:auto}
.sum .tot{font-weight:700;font-size:17px;border-top:2px solid var(--brand);padding-top:6px;margin-top:4px}
.sum span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:20px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost.done{border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.tab:focus-visible,.row:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);text-align:right;margin-top:8px;min-height:1.2em}
.err{color:#b3261e}
.privacy{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">BAZAAR IMPORTADOS</div>
      <h1>Pedidos que chegaram</h1>
    </div>
    <div class="sheetinfo" id="sheetinfo" hidden></div>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".xlsx,.xlsm,.xls">
    <strong>Carregue a planilha de vendas do dia</strong>
    <p>Arraste o arquivo .xlsx aqui ou toque para escolher. A leitura acontece só neste aparelho.</p>
  </label>

  <div class="who" id="who" hidden>Você é <input id="me" placeholder="Seu nome" autocomplete="given-name"><span class="hint" id="syncHint"></span></div>
  <div class="app" id="app" hidden>
    <section class="panel" aria-label="Clientes">
      <div class="list-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-lib" aria-selected="true">Liberadas</button>
          <button class="tab" role="tab" id="tab-all" aria-selected="false">Todas</button>
        </div>
        <input class="search" id="q" type="search" placeholder="Buscar cliente">
        <label class="chk"><input type="checkbox" id="hideSent"> Ocultar quem já foi cobrada</label>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section class="panel detail" id="detail" aria-live="polite">
      <div class="empty">Escolha uma cliente na lista para montar o PDF.</div>
    </section>
  </div>
  <p class="privacy" id="privacy" hidden>Entram no PDF os itens com BR ou ENT na coluna K (CONF). Os demais aparecem desmarcados para você conferir. Quem baixa o PDF e quem marca a cobrança aparece para toda a equipe.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
#bLink{display:none!important}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{max-width:380px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
#gate .brand{margin-bottom:6px}
#gate h2{margin:0 0 8px;font-size:22px;font-weight:600}
#gate p{margin:0 0 18px;color:var(--muted);font-size:14px}
#gate .err{color:#b3261e;margin-top:14px;font-size:13px;min-height:1em}
#logout{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted);cursor:pointer;z-index:5}
</style>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyBiJc3xwMYUyu000TMEriGRXRsx6S9pzCo",
    authDomain: "agendamento-4e283.firebaseapp.com",
    projectId: "agendamento-4e283",
    storageBucket: "agendamento-4e283.firebasestorage.app",
    messagingSenderId: "1074485928714",
    appId: "1:1074485928714:web:cf8cd6007ec3c6949890f3"
  };
  firebase.initializeApp(firebaseConfig);
  var auth=firebase.auth(), fs=firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true}) }catch(e){}
  var readyResolve, ready=new Promise(function(r){readyResolve=r});

  function gate(html){
    var g=document.getElementById('gate');
    if(!g){ g=document.createElement('div'); g.id='gate'; document.body.appendChild(g); }
    g.innerHTML='<div class="box"><div class="brand">BAZAAR IMPORTADOS</div>'+html+'</div>';
    g.hidden=false; return g;
  }
  function showLogin(err){
    var g=gate('<h2>Pedidos que chegaram</h2><p>Entre com a sua conta Google da equipe.</p><button class="btn primary" id="gLogin">Entrar com Google</button><div class="err">'+(err||'')+'</div>');
    g.querySelector('#gLogin').onclick=function(){
      var prov=new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
      auth.signInWithPopup(prov).catch(function(e){
        if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')) return auth.signInWithRedirect(prov);
        if(e&&e.code==='auth/popup-closed-by-user') return;
        showLogin('Não deu para entrar ('+(e&&e.code||'erro')+').');
      });
    };
  }
  function noAccess(email){
    var g=gate('<h2>Sem acesso</h2><p>O email <b>'+String(email||'').replace(/[<>&]/g,'')+'</b> não está liberado. Peça para a Jessica incluir você.</p><button class="btn ghost" id="gOut">Entrar com outra conta</button>');
    g.querySelector('#gOut').onclick=function(){ auth.signOut() };
  }
  auth.onAuthStateChanged(function(u){
    if(!u){ showLogin(); return; }
    fs.doc('equipe/planilha').get().then(function(){
      var g=document.getElementById('gate'); if(g) g.hidden=true;
      if(!document.getElementById('logout')){ var b=document.createElement('button'); b.id='logout'; b.textContent='Sair ('+(u.email||'')+')'; b.onclick=function(){ auth.signOut().then(function(){location.reload()}) }; document.body.appendChild(b); }
      readyResolve(u);
    },function(e){
      if(e&&e.code==='permission-denied') noAccess(u.email); else showLogin('Erro ao conectar ('+(e&&e.code||'erro')+').');
    });
  });

  function anchorSave(o){
    return new Promise(function(res){
      var url=URL.createObjectURL(o.data), a=document.createElement('a');
      a.href=url; a.download=o.filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},60000); res('saved');
    });
  }
  window.claude={use:function(name){
    if(name==='downloads') return Promise.resolve({save:anchorSave});
    if(name==='db') return ready.then(function(){ return fs });
    if(name==='user') return ready.then(function(u){ return {id:function(){return Promise.resolve(u.uid)},me:function(){return Promise.resolve({name:u.displayName||''})}} });
    return Promise.resolve(null);
  }};
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* Bazaar – pedidos: leitura da planilha e geração do PDF */
var BZ = (function () {
  var MAROON = [88, 11, 29];
  var LINE = [150, 150, 150];

  function norm(v) { return v == null ? '' : String(v).replace(/\s+/g, ' ').trim(); }
  function low(v) { return norm(v).toLowerCase(); }

  function num(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).replace(/R\$/i, '').replace(/\s/g, '');
    if (!/\d/.test(s)) return null;
    if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s);
    return isFinite(n) ? n : null;
  }

  function brl(n) {
    n = Math.round((n || 0) * 100) / 100;
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + 'R$ ' + parts[0] + ',' + parts[1];
  }

  function monthFromSheet(name) {
    var m = String(name || '').split('-').pop().trim().toUpperCase();
    return m || '';
  }

  function cepFmt(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number') { var s = String(Math.round(v)).padStart(8, '0'); return s.slice(0, 5) + '-' + s.slice(5); }
    return norm(v);
  }

  function parseSheet(XLSX, ws, sheetName) {
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
    var h = -1;
    for (var i = 0; i < Math.min(rows.length, 30); i++) {
      if (rows[i] && low(rows[i][0]) === 'cliente') { h = i; break; }
    }
    if (h < 0) throw new Error('Não encontrei a linha de cabeçalho com “CLIENTE” na coluna A.');
    var head = rows[h].map(function (x) { return norm(x).toUpperCase(); });
    function col(name, fallback) { var k = head.indexOf(name); return k > -1 ? k : fallback; }
    var C = {
      cliente: 0,
      item: col('ITEM', 7),
      valor: col('VALOR', 8),
      conf: 10, // coluna K
      status: col('STATUS AGENDAMENTO', 14),
      motoboy: col('VALOR MOTOBOY CLIENTE', 28),
      correio: col('VALOR CORREIO CLIENTE', 29),
      motoboyLoja: col('VALOR MOTOBOY LOJA', 30),
      entrega: col('STATUS ENTREGA', 35),
      bairro: col('BAIRRO', 37),
      endereco: col('ENDERECO', 38),
      complemento: col('COMPLEMENTO', 39),
      cep: col('CEP', 33),
      vendedora: col('VENDEDORA', 43),
      totalPagar: col('TOTAL A PAGAR', 21)
    };
    var map = {}, order = [];
    function get(name) {
      if (!map[name]) { map[name] = { name: name, items: [], total: null, statuses: [] }; order.push(name); }
      return map[name];
    }
    for (var r = h + 1; r < rows.length; r++) {
      var row = rows[r]; if (!row) continue;
      var a = norm(row[C.cliente]); if (!a) continue;
      var isTotal = / total$/i.test(a);
      var name = isTotal ? a.replace(/ total$/i, '').trim() : a;
      var c = get(name);
      var st = norm(row[C.status]); if (st) c.statuses.push(st);
      if (isTotal) { c.total = row; continue; }
      var item = norm(row[C.item]);
      if (!item) continue;
      var conf = low(row[C.conf]);
      if (!c.vendedora && row[C.vendedora]) c.vendedora = norm(row[C.vendedora]);
      var obsJ = norm(row[9]);
      var chegou = conf === 'br' || conf === 'ent';
      var atraso = /atras|atraz/i.test(obsJ) && !/remanejad/i.test(obsJ) && !chegou && conf !== 'nok';
      c.items.push({ name: item, value: num(row[C.valor]), conf: conf, atraso: atraso, include: (chegou && !/aniversariante|open\s*bag/i.test(item)) || atraso });
    }
    var month = monthFromSheet(sheetName);
    return order.map(function (n) {
      var c = map[n], t = c.total || [];
      var stl = c.statuses.map(low);
      c.liberada = stl.some(function (s) { return s === 'liberada'; });
      c.statusText = c.statuses.join(' · ');
      c.entregue = low(t[C.entrega]) === 'entregue';
      var mb = t[C.motoboy], co = num(t[C.correio]);
      var frete = 0, freteTipo = '';
      if (num(mb) != null) { frete = num(mb); freteTipo = 'Motoboy'; }
      else if (co != null) { frete = co; freteTipo = 'Correios'; }
      else if (low(mb) === 'correios') { freteTipo = 'Correios'; }
      else if (num(t[C.motoboyLoja]) != null) { freteTipo = 'Pago pela loja'; }
      c.frete = frete; c.freteTipo = freteTipo;
      var end = [norm(t[C.endereco]), norm(t[C.complemento]), norm(t[C.bairro])].filter(Boolean);
      var cep = cepFmt(t[C.cep]); if (cep) end.push('CEP ' + cep);
      c.endereco = end.join(' - ');
      c.totalPlanilha = num(t[C.totalPagar]);
      c.firstName = n.replace(/\s+\d{3,}\s*$/, '').split(' ')[0];
      c.fullName = n.replace(/\s+\d{3,}\s*$/, '');
      c.month = month;
      c.nIncluded = c.items.filter(function (i) { return i.include; }).length;
      delete c.total; delete c.statuses;
      return c;
    });
  }

  function totals(items, frete, creditoExtra) {
    var prod = 0, cred = 0;
    items.forEach(function (i) {
      if (!i.include || i.atraso) return;
      var v = i.value || 0;
      if (v < 0) cred += -v; else prod += v;
    });
    cred += (creditoExtra || 0);
    var gratis = prod > 2000;
    var fr = gratis ? 0 : (frete || 0);
    return { produtos: prod, credito: cred, frete: fr, freteGratis: gratis && (frete || 0) > 0, total: prod - cred + fr };
  }

  /* ---------------- PDF ---------------- */
  function clean(s) {
    return String(s == null ? '' : s)
      .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')

      doc.setTextColor(0, 0, 0); doc.setFontSize(10.5);

  }

  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}

  // arquivo

  drop.addEventListener('drop',function(ev){var f=ev.dataTransfer.files[0]; if(f) readFile(f)});
  file.addEventListener('change',function(){ if(file.files[0]) readFile(file.files[0]) });

  function readFile(f){
    drop.querySelector('strong').textContent='Lendo '+f.name+'…';
    var r=new FileReader();
    r.onload=function(){
      setTimeout(function(){
        try{
          state.wb=XLSX.read(new Uint8Array(r.result),{type:'array',cellFormula:false,cellHTML:false,cellText:false});
          var names=state.wb.SheetNames;
          var pick=names.find(function(n){return /^\s*BR\b/i.test(n)})||names[0];
          state.fileName=f.name;
          loadSheet(pick);
        }catch(e){
          drop.querySelector('strong').textContent='Não consegui ler esse arquivo';
          drop.querySelector('p').textContent=e.message||String(e);
        }
      },30);
    };
    r.readAsArrayBuffer(f);
  }

  function loadSheet(name){
    var cl;
    try{ cl=BZ.parseSheet(XLSX,state.wb.Sheets[name],name); }
    catch(e){
      drop.hidden=false; $('app').hidden=true;
      drop.querySelector('strong').textContent='A aba “'+name+'” não está no formato esperado';
      drop.querySelector('p').textContent=e.message; return;
    }
    showData(cl,name);
    shareSheet();
  }

  function showData(cl,name){

    state.clients=cl;
    if(state.sheet!==name){ state.sheet=name; subscribe(); }
    state.edits={}; state.sel=state.clients.some(function(c){return c.name===keepSel})?keepSel:null;
    drop.hidden=true; $('app').hidden=false; $('privacy').hidden=false; $('who').hidden=false;
    renderSheetInfo();
    $('tab-lib').textContent='Liberadas ('+state.clients.filter(function(c){return c.liberada}).length+')';
    $('tab-all').textContent='Todas ('+state.clients.length+')';
    if(!state.clients.some(function(c){return c.liberada})) setTab('all'); else setTab(state.tab||'lib');
    if(state.sel) renderDetail(); else $('detail').innerHTML='<div class="empty">Escolha uma cliente na lista para montar o PDF.</div>';
  }

  function renderSheetInfo(){
    var si=$('sheetinfo'); si.hidden=false;
    var m=state.teamMeta, html='';
    if(state.wb){
      var opts=state.wb.SheetNames.map(function(n){return '<option'+(n===state.sheet?' selected':'')+'>'+esc(n)+'</option>'}).join('');
      html=esc(state.fileName||'')+'<br>Aba <select id="sheetSel">'+opts+'</select> ';
    } else if(m){
      html=esc(m.arquivo||'Planilha')+' · '+esc(m.aba||'')+'<br>';
    }
    if(m&&m.v===teamVer) html+='<span id="shareMsg">Enviada'+(m.por?' por '+esc(m.por):'')+' em '+fmtWhen(m.em)+'</span> ';

  function unpackClients(arr){ return arr.map(function(o){return {name:o.n,fullName:o.fn,firstName:o.f,liberada:!!o.l,statusText:o.s,entregue:!!o.e,frete:o.fr||0,freteTipo:o.ft,endereco:o.en,totalPlanilha:o.tp,month:o.m,vendedora:o.vd,items:o.it.map(function(a){return {name:a[0],value:a[1],conf:a[2],atraso:!!a[3],include:((a[2]==='br'||a[2]==='ent')&&!/aniversariante|open\s*bag/i.test(a[0]))||!!a[3]}})}}) }
  function shareSheet(){

  }
  function watchTeamSheet(){
    db.doc('equipe/planilha').onSnapshot(function(snap){
      if(!snap.exists){ if(!state.clients.length) resetDrop(); return }
      var m=snap.data(); state.teamMeta=m;
      if(m.v===teamVer){ if(state.clients.length) renderSheetInfo(); return }
      teamVer=m.v; fetchTeamSheet(m);
    },function(){ if(!state.clients.length) resetDrop(); });
  }
  function fetchTeamSheet(m){
    if(!state.clients.length){ drop.querySelector('strong').textContent='Abrindo a planilha da equipe…'; drop.querySelector('p').textContent=''; }
    var gets=[]; for(var i=0;i<m.partes;i++) gets.push(db.collection('planilha_partes').doc(m.v+'_'+i).get());
    Promise.all(gets).then(function(snaps){
      if(m.v!==teamVer) return;
      if(snaps.some(function(s){return !s.exists})) throw new Error('incompleta');
      var cl=unpackClients(JSON.parse(snaps.map(function(s){return s.data().d}).join('')));
      state.wb=null; state.fileName=m.arquivo; state.shareMsg='';
      showData(cl,m.aba);
    }).catch(function(){ if(!state.clients.length) resetDrop(); });
  }
  function resetDrop(){
    drop.querySelector('strong').textContent='Carregue a planilha de vendas do dia';
    drop.querySelector('p').textContent='Arraste o arquivo .xlsx aqui ou toque para escolher. Depois de carregada, ela aparece para toda a equipe.';
  }

  function setTab(t){state.tab=t;$('tab-lib').setAttribute('aria-selected',t==='lib');$('tab-all').setAttribute('aria-selected',t==='all');renderList()}
  $('tab-lib').onclick=function(){setTab('lib')};
  $('tab-all').onclick=function(){setTab('all')};
  $('q').oninput=renderList; $('hideSent').onchange=renderList;

  function edit(c){
    if(!state.edits[c.name]){
      state.edits[c.name]={items:c.items.map(function(i){return {name:i.name,value:i.value,conf:i.conf,atraso:i.atraso,include:i.include}}),frete:c.frete,creditoExtra:0,endereco:c.endereco,month:c.month};
    }
    return state.edits[c.name];
  }

  function renderList(){
    var q=$('q').value.trim().toLowerCase(), hide=$('hideSent').checked;
    var arr=state.clients.filter(function(c){
      if(state.tab==='lib'&&!c.liberada) return false;
      if(hide&&isCobrada(c)) return false;
      if(q&&c.name.toLowerCase().indexOf(q)<0) return false;
      return true;
    });
    if(!arr.length){$('list').innerHTML='<div class="empty">'+(state.tab==='lib'?'Nenhuma cliente com LIBERADA na coluna de status agendamento.':'Nenhuma cliente encontrada.')+'</div>';return}
    $('list').innerHTML=arr.map(function(c){
      var e=state.edits[c.name], t=BZ.totals(e?e.items:c.items,e?e.frete:c.frete,e?e.creditoExtra:0);
      var inc=(e?e.items:c.items).filter(function(i){return i.include}).length;
      return '<button class="row" data-n="'+esc(c.name)+'"'+(state.sel===c.name?' aria-current="true"':'')+'>'+
        '<span class="n"><span>'+esc(c.name)+'</span>'+pillFor(c)+'</span>'+
        '<span class="m"><span>'+inc+' de '+c.items.length+' itens</span><span>'+BZ.brl(t.total)+'</span>'+atendeu(c)+'</span></button>';
    }).join('');
  }
  function pillFor(c){
    var m=getMark(c);
    if(m&&m.cobrada) return '<span class="pill sent">Cobrada</span>';
    if(m&&m.pdf) return '<span class="pill pdf">PDF baixado</span>';
    if(c.liberada&&state.tab==='all') return '<span class="pill lib">Liberada</span>';
    return '';
  }
  function atendeu(c){
    var m=getMark(c);
    return (m&&m.pdf&&m.pdf.por)?'<span>Atendida por <b>'+esc(m.pdf.por)+'</b></span>':'';
  }
  function stCls(s){ return (s==='br'||s==='ent')?'ok':(s?'no':'') }
  function renderMarks(){
    var c=current(); if(!c||!$('marks')) return; var m=getMark(c)||{};
    var h='';
    h+= m.pdf? '<div class="mark pdf">PDF baixado por <b>'+esc(m.pdf.por||'alguém')+'</b> em '+fmtWhen(m.pdf.em)+'</div>' : '<div class="mark">PDF ainda não baixado</div>';
    h+= m.cobrada? '<div class="mark ok">Cliente cobrada por <b>'+esc(m.cobrada.por||'alguém')+'</b> em '+fmtWhen(m.cobrada.em)+'</div>' : '<div class="mark">Cliente ainda não cobrada</div>';
    $('marks').innerHTML=h;
    var b=$('bSent'); if(b){ b.textContent=m.cobrada?'Desfazer cobrança':'Marcar como cobrada'; b.classList.toggle('done',!!m.cobrada) }
  }
  function needName(){
    if(myName()) return false;
    var msg=$('msg'); msg.className='msg err'; msg.textContent='Escreva seu nome em “Você é” lá em cima, para a equipe saber quem fez.';
    $('me').focus(); return true;
  }
  $('list').addEventListener('click',function(ev){
    var b=ev.target.closest('.row'); if(!b) return;
    state.sel=b.getAttribute('data-n'); renderList(); renderDetail();
    if(window.innerWidth<=820) $('detail').scrollIntoView({behavior:'smooth',block:'start'});
  });

  function current(){return state.clients.find(function(c){return c.name===state.sel})}

  function renderDetail(){
    var c=current(); if(!c) return; var e=edit(c);
    var html='<h2>'+esc(c.fullName)+'</h2><div class="sub">'+esc(c.name)+(c.statusText?' · '+esc(c.statusText):'')+(c.entregue?' · ENTREGUE':'')+'</div>'+
    '<div class="grid2">'+
      '<label class="f">Mês do pedido<input id="fMonth" value="'+esc(e.month)+'"></label>'+
      '<label class="f">Frete'+(c.freteTipo?' ('+esc(c.freteTipo)+')':'')+'<input id="fFrete" inputmode="decimal" value="'+String(e.frete).replace('.',',')+'"></label>'+
      '<label class="f">Crédito / desconto extra<input id="fCred" inputmode="decimal" value="'+(e.creditoExtra?String(e.creditoExtra).replace('.',','):'')+'" placeholder="0,00"></label>'+
      '<label class="f full">Endereço de entrega<textarea id="fEnd">'+esc(e.endereco)+'</textarea></label>'+
    '</div>'+
    '<div class="items"><div class="items-h"><span>Itens</span><span id="cnt"></span></div>'+
    e.items.map(function(it,i){
      var st=it.atraso?'atraso':(it.conf||'');
      var base=[['ent','ENT'],['br','BR'],['atraso','EM ATRASO'],['ok','OK'],['online','ONLINE'],['nok','NOK']];
      if(!base.some(function(o){return o[0]===st})) base.push([st,st?st.toUpperCase():'VAZIO']);
      var opts=base.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===st?' selected':'')+'>'+esc(o[1])+'</option>'}).join('');
      var v=it.value==null?'':it.value.toFixed(2).replace('.',',');
      return '<div class="it'+(it.include?'':' off')+'" data-i="'+i+'"><input type="checkbox" class="inc"'+(it.include?' checked':'')+' aria-label="Incluir no PDF">'+
        '<input class="nm" value="'+esc(it.name)+'" aria-label="Nome do produto" title="Clique para editar">'+'<span class="ctl"><select class="st '+stCls(st)+'" aria-label="Situação">'+opts+'</select>'+
        '<input class="val'+(it.atraso?' muted':'')+'" inputmode="decimal" value="'+v+'" placeholder="0,00" aria-label="Valor"'+(it.atraso?' title="Em atraso: não é cobrado"':'')+'></span></div>';
    }).join('')+'</div>'+
    '<div class="sum" id="sum"></div><div id="note"></div>'+
    '<div class="marks" id="marks"></div>'+
    '<div class="actions"><button class="btn ghost" id="bSent"></button><button class="btn ghost" id="bLink">Baixar como imagem</button><button class="btn primary" id="bPdf">Baixar PDF</button></div><div class="msg" id="msg"></div>';
    $('detail').innerHTML=html;
    $('detail').querySelectorAll('.it').forEach(function(row){
      var it=e.items[+row.dataset.i], cb=row.querySelector('.inc'), sel=row.querySelector('.st'), val=row.querySelector('.val');
      cb.onchange=function(){ it.include=cb.checked; row.classList.toggle('off',!cb.checked); refresh() };
      sel.onchange=function(){
        var s=sel.value; it.atraso=(s==='atraso'); if(!it.atraso) it.conf=s;
        it.include=(s==='br'||s==='ent'||s==='atraso'); cb.checked=it.include; row.classList.toggle('off',!it.include);
        sel.className='st '+stCls(s); val.classList.toggle('muted',it.atraso); refresh();
      };
      var nm=row.querySelector('.nm'); nm.oninput=function(){ it.name=nm.value };
      val.oninput=function(){ var n=BZ.num(val.value); it.value=(val.value.trim()===''?null:n); refresh() };
    });
    $('fMonth').oninput=function(){e.month=this.value};
    $('fFrete').oninput=function(){e.frete=BZ.num(this.value)||0;refresh()};
    $('fCred').oninput=function(){e.creditoExtra=BZ.num(this.value)||0;refresh()};
    $('fEnd').oninput=function(){e.endereco=this.value};
    $('bPdf').onclick=function(){makePdf(false)};
    $('bLink').onclick=function(){makePdf(true)};
    if(!(window.claude&&window.claude.use)) $('bLink').hidden=true;
    $('bSent').onclick=function(){
      if(isCobrada(c)){ if(confirm('Desfazer a marcação de cobrança de '+c.fullName+'?')) writeMark(c,{cobrada:null}); return }
      if(needName()) return;
      writeMark(c,{cobrada:{por:myName(),uid:uid,em:Date.now()}});
    };
    refresh();
  }

  function refresh(){
    var c=current(), e=edit(c), t=BZ.totals(e.items,e.frete,e.creditoExtra);
    var n=e.items.filter(function(i){return i.include}).length;
    $('cnt').textContent=n+' de '+e.items.length+' no PDF';
    $('sum').innerHTML='<span>Total em produtos</span><span>'+BZ.brl(t.produtos)+'</span><span>Crédito / desconto</span><span>-'+BZ.brl(t.credito)+'</span><span>Frete</span><span>'+BZ.brl(t.frete)+'</span><span class="tot">Total a pagar</span><span class="tot">'+BZ.brl(t.total)+'</span>';
    var note='';
    if(c.totalPlanilha!=null&&Math.abs(c.totalPlanilha-t.total)>0.009) note='Na linha “Total” da planilha está '+BZ.brl(c.totalPlanilha)+'. A diferença costuma ser de itens que ainda não estão como BR ou ENT.';
    if(!n) note='Nenhum item marcado para o PDF.';
    $('note').innerHTML=note?'<div class="note">'+esc(note)+'</div>':'';
    $('bPdf').disabled=!n; $('bLink').disabled=!n;
    if(t.freteGratis) note=(note?note+' ':'')+'Frete zerado: compra acima de R$ 2.000,00 em produtos.';
    else if(c.freteTipo==='Correios'&&!e.frete) note=(note?note+' ':'')+'Cliente de Correios sem valor de frete na planilha: preencha o frete antes de baixar.';
    $('note').innerHTML=note?'<div class="note">'+esc(note)+'</div>':'';
    renderMarks();
  }

  /* ---- “PDF” desenhado em imagem (para quem não consegue baixar PDF) ---- */
  function makeCanvasDocCtor(images, scale){
    var FAM={helvetica:'Helvetica, Arial, sans-serif',Montserrat:'Montserrat, Helvetica, Arial, sans-serif'};
    function Doc(){ this.pages=[]; this.f='helvetica'; this.st='normal'; this.sz=12; this.fill='#000'; this.draw='#000'; this.tc='#000'; this.lw=1; this.addPage(); }
    function rgb(a){ return 'rgb('+a[0]+','+a[1]+','+a[2]+')' }
    Doc.prototype.addPage=function(){ var c=document.createElement('canvas'); c.width=Math.round(595.28*scale); c.height=Math.round(841.89*scale); var x=c.getContext('2d'); x.setTransform(scale,0,0,scale,0,0); x.fillStyle='#fff'; x.fillRect(0,0,595.28,841.89); this.pages.push(c); this.ctx=x; return this; };
    Doc.prototype._font=function(){ this.ctx.font=(this.st==='bold'?'700 ':'400 ')+this.sz+'px '+(FAM[this.f]||FAM.helvetica); };
    Doc.prototype.setFont=function(f,s){ this.f=f; this.st=s||'normal'; return this; };
    Doc.prototype.setFontSize=function(s){ this.sz=s; return this; };
    Doc.prototype.getTextWidth=function(t){ this._font(); return this.ctx.measureText(t).width; };
    Doc.prototype.setFillColor=function(r,g,b){ this.fill=rgb([r,g,b]); return this; };
    Doc.prototype.setDrawColor=function(r,g,b){ this.draw=rgb([r,g,b]); return this; };
    Doc.prototype.setTextColor=function(r,g,b){ this.tc=rgb([r,g,b]); return this; };
    Doc.prototype.setLineWidth=function(w){ this.lw=w; return this; };
    Doc.prototype.text=function(t,x,y,o){
      o=o||{}; var x0=this.ctx; this._font(); x0.fillStyle=this.tc; x0.textBaseline='alphabetic';
      x0.textAlign=o.align==='center'?'center':(o.align==='right'?'right':'left');
      var lines=Array.isArray(t)?t:[t], lh=this.sz*(o.lineHeightFactor||1.15);
      for(var i=0;i<lines.length;i++) x0.fillText(lines[i],x,y+i*lh);
      return this;
    };
    Doc.prototype.splitTextToSize=function(t,w){
      var words=String(t).split(/\s+/), out=[], cur='';
      for(var i=0;i<words.length;i++){ var tryS=cur?cur+' '+words[i]:words[i]; if(cur&&this.getTextWidth(tryS)>w){ out.push(cur); cur=words[i] } else cur=tryS }
      if(cur) out.push(cur); return out.length?out:[''];
    };
    Doc.prototype.rect=function(x,y,w,h){ this.ctx.fillStyle=this.fill; this.ctx.fillRect(x,y,w,h); return this; };
    Doc.prototype.line=function(a,b,c,d){ var x=this.ctx; x.strokeStyle=this.draw; x.lineWidth=this.lw; x.beginPath(); x.moveTo(a,b); x.lineTo(c,d); x.stroke(); return this; };
    Doc.prototype.triangle=function(a,b,c,d,e,f){ var x=this.ctx; x.fillStyle=this.fill; x.beginPath(); x.moveTo(a,b); x.lineTo(c,d); x.lineTo(e,f); x.closePath(); x.fill(); return this; };
    Doc.prototype.circle=function(a,b,r){ var x=this.ctx; x.fillStyle=this.fill; x.beginPath(); x.arc(a,b,r,0,Math.PI*2); x.fill(); return this; };
    Doc.prototype.addImage=function(src,fmt,x,y,w,h){ var im=images[src]; if(im) this.ctx.drawImage(im,x,y,w,h); return this; };
    Doc.prototype.addFileToVFS=function(){}; Doc.prototype.addFont=function(){}; Doc.prototype.setProperties=function(){};
    return Doc;
  }
  var imgCache=null;
  function loadImages(){
    if(imgCache) return imgCache;
    imgCache=Promise.all([ASSETS.bg,ASSETS.p2].map(function(src){ return new Promise(function(res){ var im=new Image(); im.onload=function(){res([src,im])}; im.onerror=function(){res([src,null])}; im.src=src; }) }))
      .then(function(pairs){ var m={}; pairs.forEach(function(p){ m[p[0]]=p[1] }); return m; });
    return imgCache;
  }
  function renderImages(c,e){
    var fontsReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('400 20px Montserrat'),document.fonts.load('700 20px Montserrat')]).catch(function(){}):Promise.resolve();
    return Promise.all([loadImages(),fontsReady]).then(function(r){
      var Ctor=makeCanvasDocCtor(r[0],2.2);
      var doc=BZ.buildPdf(Ctor,ASSETS,c,e);
      return Promise.all(doc.pages.map(function(cv){ return new Promise(function(res){ cv.toBlob(function(b){res(b)},'image/jpeg',0.9) }) }));
    });
  }
  var assetsPromise=null;
  function assetsP(){ if(!assetsPromise){ assetsPromise=(window.claude&&window.claude.use)?window.claude.use('assets').catch(function(){return null}):Promise.resolve(null) } return assetsPromise }
  function makePdf(linkMode){
    var c=current(), e=edit(c), btn=linkMode?$('bLink'):$('bPdf'), msg=$('msg');
    if(needName()) return;
    btn.disabled=true; msg.className='msg'; msg.textContent='Gerando PDF…';
    setTimeout(function(){
      var blob, fname='Pedido '+c.fullName+' - '+(e.month||'').toLowerCase().replace(/^./,function(x){return x.toUpperCase()})+'.pdf';
      try{ blob=BZ.buildPdf(window.jspdf.jsPDF,ASSETS,c,e).output('blob'); }
      catch(err){ msg.className='msg err'; msg.textContent='Erro ao gerar: '+(err.message||err); btn.disabled=false; return; }
      function ok(){ msg.className='msg'; msg.textContent='PDF salvo. Depois de cobrar a cliente, toque em “Marcar como cobrada”.'; writeMark(c,{pdf:{por:myName(),uid:uid,em:Date.now()}}); }
      function viaLink(code){
        msg.className='msg'; msg.textContent=code?'O PDF não pôde ser salvo aqui, então vou salvar o pedido como imagem…':'Preparando as imagens do pedido…';
        var base=fname.replace(/\.pdf$/,'');
        return renderImages(c,e).then(function(blobs){
          var n=blobs.length, names=blobs.map(function(b,i){ return base+' ('+(i+1)+' de '+n+').jpg' });
          return dl().then(function(d){
            if(!d){
              blobs.forEach(function(b,i){ try{ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=names[i]; document.body.appendChild(a); a.click(); a.remove(); }catch(x){} });
              msg.className='msg'; msg.textContent='Imagens geradas.'; writeMark(c,{pdf:{por:myName(),uid:uid,em:Date.now()}}); return;
            }
            var p=Promise.resolve();
            blobs.forEach(function(b,i){ p=p.then(function(){ msg.className='msg'; msg.textContent='Confirme o download da imagem '+(i+1)+' de '+n+'…'; return d.save({filename:names[i],data:b}) }) });
            return p.then(function(){
              msg.className='msg'; msg.textContent='Pedido salvo em '+n+' imagens. Depois de cobrar a cliente, toque em “Marcar como cobrada”.';
              writeMark(c,{pdf:{por:myName(),uid:uid,em:Date.now()}});
            },function(er){
              msg.className='msg err';
              msg.textContent=(er&&er.code==='declined')?'Download cancelado. Toque de novo e confirme na janelinha.':'Não consegui salvar. Código: '+(code?code+' / ':'')+'img-'+(er&&er.code||'erro')+'. Me mande esse código.';
            });
          });
        },function(err){ msg.className='msg err'; msg.textContent='Erro ao gerar as imagens: '+(err&&err.message||err); });
      }
      function fallback(code){
        var f=null; try{ f=new File([blob],fname,{type:'application/pdf'}) }catch(e){}
        if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
          return navigator.share({files:[f],title:fname}).then(ok,function(e){ if(e&&e.name==='AbortError'){msg.textContent='Compartilhamento cancelado.';return} return plain(code) });
        }
        return plain(code);
      }
      function plain(code){
        try{ var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=fname; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
        msg.className='msg err';
        msg.textContent='Se o PDF não baixou: abra o link logada na sua conta Claude (pelo convite que chegou no email) e aceite a janelinha de confirmação do download. Código: '+(code||'sem-permissao')+'.';
        writeMark(c,{pdf:{por:myName(),uid:uid,em:Date.now()}});
      }
      if(!(window.claude&&window.claude.use)){
        try{ var u0=URL.createObjectURL(blob); var a0=document.createElement('a'); a0.href=u0; a0.download=fname; document.body.appendChild(a0); a0.click(); a0.remove(); }catch(e){}
        ok(); btn.disabled=false; return;
      }
      if(linkMode){ viaLink('').finally(function(){btn.disabled=false}); return }
      dl().then(function(d){
        if(!d) return viaLink('sem-acesso');
        return d.save({filename:fname,data:blob}).then(ok,function(er){
          var code=er&&er.code;
          if(code==='declined'){ msg.textContent='Download cancelado. Toque em Baixar PDF de novo e confirme na janelinha.'; return }
          if(code==='rate_limited'){ msg.textContent='Já tem uma confirmação de download aberta. Confirme ou espere alguns segundos.'; return }
          return viaLink(code);
        });
      }).finally(function(){btn.disabled=false});
    },20);
  }
})();
